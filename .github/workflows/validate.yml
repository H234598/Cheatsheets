name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-test.txt

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Berichtsverzeichnis und Quellzeit setzen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt \
            -r requirements-test.txt
          python -m pip check
          npm ci --ignore-scripts
          npm ls --all

      - name: Chromium für Playwright installieren
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium

      - name: Workflow-Policy prüfen
        run: >-
          python scripts/validate_workflows.py
          --report build/reports/workflows.json

      - name: Python- und JavaScriptquellen kompilieren
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          node --check web/assets/javascripts/site-state.js
          node --check web/assets/javascripts/filters.js
          node --check web/assets/javascripts/accessibility.js
          node --check web/assets/javascripts/mermaid-loader.js
          node --check web/assets/javascripts/offline-navigation.js
          node --check web/assets/javascripts/graph-shortcut.js
          node --check web/assets/javascripts/knowledge-graph.js
          node --check playwright.config.mjs
          node --check tests/web/site.spec.mjs
          node --check tests/web/offline.spec.mjs
          node --check tests/web/graph.spec.mjs

      - name: Unit- und Integrationstests
        run: >-
          python -m pytest -q
          --junitxml=build/reports/pytest.xml

      - name: Contentmodell prüfen
        run: >-
          python scripts/validate_content.py
          --report build/reports/content.json

      - name: Links und Callouts prüfen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_links.py \
            --report build/reports/links.json \
            2>&1 | tee build/reports/links.txt

      - name: Secrets, Raw HTML und Laufzeitassets prüfen
        run: >-
          python scripts/validate_security.py
          --report build/reports/security.json

      - name: Erwartete kanonische Metadaten erzeugen
        run: >-
          python scripts/build_manifest.py
          --output build/reports/expected-metadata

      - name: Kanonische Metadaten vergleichen
        shell: bash
        run: |
          set -euo pipefail
          : > build/reports/metadata-diff.patch
          for name in MANIFEST.csv MANIFEST.md BUILD-REPORT.yaml SHA256SUMS.txt; do
            diff -u "$name" "build/reports/expected-metadata/$name" \
              >> build/reports/metadata-diff.patch || true
          done
          if test -s build/reports/metadata-diff.patch; then
            cat build/reports/metadata-diff.patch >&2
            exit 1
          fi

      - name: Vollständige Project-Page-Site einmalig bauen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py \
            --strict \
            --site-url http://127.0.0.1:4173/Cheatsheets/ \
            2>&1 | tee build/reports/build-site.txt

      - name: Wissensgraph unabhängig prüfen
        run: >-
          python scripts/validate_graph.py
          --graph build/docs/data/knowledge-graph.json
          --site-dir site
          --report build/reports/knowledge-graph.json

      - name: Offline-HTML unabhängig prüfen und entpacken
        run: >-
          python scripts/validate_offline_archive.py
          --archive site/downloads/files/Cheatsheets-Offline-HTML.zip
          --extract build/offline-site
          --report build/reports/offline.json
          --force

      - name: Pages-Artefakt validieren
        run: >-
          python scripts/validate_pages_artifact.py
          --site-dir site
          --report build/reports/pages-artifact.json

      - name: Webbudgets und lokale Laufzeitassets prüfen
        run: >-
          python scripts/validate_web_budgets.py
          --site-dir site
          --report build/reports/web-budgets.json

      - name: Browser-, Accessibility- und Mobiltests
        env:
          CI: "true"
          SITE_DIR: site
          WEB_TEST_BASE_PATH: /Cheatsheets/
          WEB_TEST_PORT: "4173"
          OFFLINE_SITE_DIR: build/offline-site
          OFFLINE_TEST_PORT: "4174"
        run: npm run test:web

      - name: Unveränderte Quellarbeitskopie bestätigen
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --short

      - name: Diagnostikartefakte hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports-${{ github.run_id }}
          path: build/reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: false
