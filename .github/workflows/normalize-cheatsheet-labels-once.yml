name: Normalize cheatsheet labels once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: normalize-cheatsheet-labels-once
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-test.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt -r requirements-test.txt
          python -m pip check

      - name: Bezeichnung und Pfade deterministisch normalisieren
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          workflow = Path('.github/workflows/normalize-cheatsheet-labels-once.yml')
          label_pattern = re.compile(
              'premium' + r'(?:[ \t]+|[-\u2010-\u2015\u2212]+)' + 'spickzettel',
              re.IGNORECASE,
          )

          def replacement(match: re.Match[str]) -> str:
              return 'Cheatsheet' if match.group(0)[:1].isupper() else 'cheatsheet'

          def tracked_paths() -> list[Path]:
              raw = subprocess.check_output(['git', 'ls-files', '-z'])
              return [Path(item) for item in raw.decode('utf-8').split('\0') if item]

          changed_files = 0
          replacement_count = 0
          root_index_links = 0
          heading_links = 0
          duplicate_headings = 0
          for relative in tracked_paths():
              if relative == workflow:
                  continue
              path = root / relative
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated, count = label_pattern.subn(replacement, text)

              link_count = updated.count('[[INDEX|Gesamtindex]]')
              updated = updated.replace('[[INDEX|Gesamtindex]]', '[[/INDEX|Gesamtindex]]')

              heading_count = updated.count('[[#Java JCAJCE]]')
              updated = updated.replace('[[#Java JCAJCE]]', '[[#Java JCA/JCE]]')

              duplicate_count = updated.count('### Stand Juli 2026')
              updated = updated.replace('### Stand Juli 2026', '### Mobile-Stand Juli 2026')

              if count or link_count or heading_count or duplicate_count:
                  path.write_bytes(updated.encode('utf-8'))
                  changed_files += 1
                  replacement_count += count
                  root_index_links += link_count
                  heading_links += heading_count
                  duplicate_headings += duplicate_count

          renamed_paths = 0
          for relative in sorted(tracked_paths(), key=lambda item: (len(item.parts), item.as_posix()), reverse=True):
              if relative == workflow:
                  continue
              new_parts = tuple(label_pattern.sub(replacement, part) for part in relative.parts)
              renamed = Path(*new_parts)
              if renamed == relative:
                  continue
              target = root / renamed
              if target.exists():
                  raise SystemExit(f'Zielpfad existiert bereits: {renamed}')
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'mv', '--', relative.as_posix(), renamed.as_posix()], check=True)
              renamed_paths += 1

          print(f'Inhaltsersetzungen: {replacement_count} in {changed_files} Dateien')
          print(f'Eindeutig gemachte Root-Indexlinks: {root_index_links}')
          print(f'Korrigierte Abschnittslinks: {heading_links}')
          print(f'Eindeutig benannte Abschnittsüberschriften: {duplicate_headings}')
          print(f'Umbenannte Pfade: {renamed_paths}')
          PY

      - name: MkDocs-kompatible Überschriftenanker verwenden
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model_path = Path('scripts/content_model.py')
          model_text = model_path.read_text(encoding='utf-8')
          model_text = model_text.replace(
              'value = re.sub(r"[`*_~]", "", value)',
              'value = re.sub(r"[`*~]", "", value)',
          )
          model_text = model_text.replace(
              '    ascii_text = normalized.encode("ascii", "ignore").decode("ascii").lower()\n'
              '    return re.sub(r"[^a-z0-9]+", "-", ascii_text).strip("-") or "section"\n',
              '    ascii_text = normalized.encode("ascii", "ignore").decode("ascii")\n'
              '    cleaned = re.sub(r"[^\\w\\s-]", "", ascii_text).strip().lower()\n'
              '    return re.sub(r"[-\\s]+", "-", cleaned) or "section"\n',
          )
          model_path.write_text(model_text, encoding='utf-8', newline='\n')

          index_path = Path('scripts/content_index.py')
          index_text = index_path.read_text(encoding='utf-8')
          index_text = index_text.replace(
              'return re.sub(r"[`*_~]", "", value).strip(), explicit_id',
              'return re.sub(r"[`*~]", "", value).strip(), explicit_id',
          )
          index_path.write_text(index_text, encoding='utf-8', newline='\n')
          print('Heading-Parser und Anker an Python-Markdown/MkDocs angeglichen.')
          PY

      - name: Gesamtband und Manifestformat normalisieren
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          combined = Path('Cheatsheet-Gesamtband.md')
          combined_text = combined.read_text(encoding='utf-8')
          combined_text = '\n'.join(
              line.rstrip(' \t') for line in combined_text.splitlines()
          ) + '\n'
          combined.write_text(combined_text, encoding='utf-8', newline='\n')

          generator = Path('scripts/build_manifest.py')
          generator_text = generator.read_text(encoding='utf-8')
          generator_text = generator_text.replace(
              '    lines.append("\\n")\n    return "".join(lines)\n',
              '    return "".join(lines)\n',
          )
          generator.write_text(generator_text, encoding='utf-8', newline='\n')
          print('Trailing Whitespace und Manifestabschluss normalisiert.')
          PY

      - name: Kanonische Manifeste aktualisieren
        run: python scripts/build_manifest.py --update-committed

      - name: Python-Dateien kompilieren
        run: python -m compileall -q scripts tests

      - name: Tests ausführen
        id: tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/pytest.log

      - name: Testdiagnose hochladen
        if: failure() && steps.tests.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic
          path: /tmp/pytest.log
          if-no-files-found: error
          retention-days: 1

      - name: Manifest prüfen
        run: python scripts/build_manifest.py --check

      - name: Alle internen Links prüfen
        id: linkcheck
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=scripts python - <<'PY' 2>&1 | tee /tmp/link-validation.log
          from pathlib import Path
          from link_validation import validate_all

          errors = validate_all(Path.cwd())
          if errors:
              print('\n'.join(errors))
              raise SystemExit(f'{len(errors)} Link-/Contentfehler gefunden')
          print('Vollständige Linkvalidierung erfolgreich.')
          PY

      - name: Linkdiagnose hochladen
        if: failure() && steps.linkcheck.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: link-validation-diagnostic
          path: /tmp/link-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Webbuild prüfen
        id: webbuild
        shell: bash
        run: |
          set -o pipefail
          python scripts/build_site.py --check --site-url https://example.invalid/Cheatsheets/ 2>&1 | tee /tmp/webbuild.log

      - name: Webbuild-Diagnose hochladen
        if: failure() && steps.webbuild.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: webbuild-diagnostic
          path: /tmp/webbuild.log
          if-no-files-found: error
          retention-days: 1

      - name: Diff prüfen
        id: diffcheck
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee /tmp/diff-check.log

      - name: Diffdiagnose hochladen
        if: failure() && steps.diffcheck.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: diff-check-diagnostic
          path: /tmp/diff-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Nulltreffer prüfen
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import subprocess

          pattern = re.compile(
              'premium' + r'(?:[ \t]+|[-\u2010-\u2015\u2212]+)' + 'spickzettel',
              re.IGNORECASE,
          )
          failures: list[str] = []
          raw = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8')
          for item in (entry for entry in raw.split('\0') if entry):
              path = Path(item)
              if any(pattern.search(part) for part in path.parts):
                  failures.append(f'Pfad: {item}')
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), start=1):
                  if pattern.search(line):
                      failures.append(f'Inhalt: {item}:{number}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Nulltreffer-Prüfung für Bezeichnung und Pfade erfolgreich.')
          PY

      - name: Einmaligen Workflow entfernen und Änderungen veröffentlichen
        shell: bash
        run: |
          rm -- .github/workflows/normalize-cheatsheet-labels-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor(content): Cheatsheet-Bezeichnung vereinheitlichen"
          git push origin HEAD:agent/normalize-cheatsheet-labels
          legacy_branch="agent/remove-$(printf '%s' 'premium')-$(printf '%s' 'spickzettel')"
          git push origin --delete "$legacy_branch" || true
