site_name: Cheatsheets
site_description: Obsidian-kompatible technische Cheatsheets
site_url: https://h234598.github.io/Cheatsheets/

docs_dir: build/docs
site_dir: site
strict: true
use_directory_urls: true
exclude_docs: |
  .cheatsheets-build-root
not_in_nav: |
  /404.md
  /downloads/**
  /index/quelle.md
  /intern/**
  /wissensgraph/**

theme:
  name: material
  language: de
  custom_dir: web/overrides
  font: false
  features:
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dunklen Modus aktivieren
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Hellen Modus aktivieren

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - meta
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true
      permalink_title: Direktlink zu diesem Abschnitt

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

extra:
  source_repository_url: https://github.com/H234598/Cheatsheets
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/H234598/Cheatsheets
      name: Cheatsheets-Quellrepository auf GitHub

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/accessibility.css
  - assets/stylesheets/knowledge-graph.css

extra_javascript:
  - assets/javascripts/site-state.js
  - assets/javascripts/filters.js
  - assets/javascripts/accessibility.js
  - assets/javascripts/mermaid-loader.js
  - assets/javascripts/graph-shortcut.js
  - assets/javascripts/knowledge-graph.js
